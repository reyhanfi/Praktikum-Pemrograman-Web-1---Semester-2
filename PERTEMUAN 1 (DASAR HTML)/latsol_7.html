<!DOCTYPE html>
<html>
<head>
    <title>Jenis List</title>
</head>
<body>

    <h2 align="center">Ordered List</h2>

    <ol type="1" align="left">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ol>

    <h2 align="center">Unordered List</h2>

    <ul type="square" align="right">
        <li>Frontend</li>
        <li>Backend</li>
        <li>Database</li>
    </ul>

</body>
</html>
