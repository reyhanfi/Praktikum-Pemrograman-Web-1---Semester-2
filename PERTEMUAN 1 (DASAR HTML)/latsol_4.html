<!DOCTYPE html>
<html>
<head>
    <title>Pemformatan Teks</title>
</head>
<body>

    <h2 align="center">Contoh Text Formatting</h2>

    <p align="justify">
        <strong>HTML</strong> adalah bahasa markah standar untuk membuat halaman web.
        HTML dapat dikombinasikan dengan <em>CSS</em> untuk mengatur tampilan
        dan <u>JavaScript</u> untuk interaktivitas.
    </p>

    <p align="left">
        Rumus kimia: H<sub>2</sub>O <br>
        Rumus matematika: X<sup>2</sup>
    </p>

    <p align="right">
        Teks <mark>ditandai</mark>, 
        <small>lebih kecil</small>, 
        <del>dihapus</del>, 
        <ins>ditambahkan</ins>.
    </p>

</body>
</html>
