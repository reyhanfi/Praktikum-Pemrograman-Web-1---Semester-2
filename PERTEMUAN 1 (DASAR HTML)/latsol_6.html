<!DOCTYPE html>
<html>
<head>
    <title>Arah Teks dan Quotation</title>
</head>
<body>

    <h2 align="center">Quotation dan Direction</h2>

    <blockquote align="justify">
        "HTML is the standard markup language for creating Web pages."
    </blockquote>

    <p align="left">
        Kutipan pendek: <q>Belajar HTML itu menyenangkan.</q>
    </p>

    <p align="right">
        <bdo dir="rtl">Teks ini dari kanan ke kiri</bdo>
    </p>

</body>
</html>
