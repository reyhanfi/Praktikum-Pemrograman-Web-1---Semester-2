<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Pendaftaran</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">

<div class="container bg-white p-4 rounded shadow-sm" style="max-width: 800px;">
  <div id="alertSukses" class="alert alert-success fade d-none" role="alert">
    Data berhasil disimpan!
  </div>

  <h2>Pendaftaran Mahasiswa</h2>

  <form>
    <input type="text" class="form-control mb-3 is-valid" placeholder="Nama Lengkap">
    <input type="text" class="form-control mb-3 is-invalid" placeholder="NIM">
    <input type="email" class="form-control mb-3" placeholder="Email">

    <select class="form-select mb-3">
      <option selected>Pilih Program Studi</option>
      <option>TRPL</option>
      <option>TRI</option>
    </select>

    <textarea class="form-control mb-3" rows="3" placeholder="Alamat"></textarea>

    <button type="button" class="btn btn-primary" onclick="simpanData()">Simpan</button>
    <button type="reset" class="btn btn-secondary">Reset</button>
  </form>
</div>

<script>
function simpanData() {
  const alertBox = document.getElementById('alertSukses');
  alertBox.classList.remove('d-none');
  alertBox.classList.add('show');
}
</script>

</body>
</html>
