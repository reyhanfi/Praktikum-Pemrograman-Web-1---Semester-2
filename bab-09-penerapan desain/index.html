<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lardi's | Visual Storyteller</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
    }

    /* NAVBAR */
    .navbar {
      height: 64px;
      background: #fff;
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }

    .navbar-brand {
      font-weight: 700;
      letter-spacing: 2px;
      font-size: 14px;
    }

    .nav-link {
      font-size: 12px;
      letter-spacing: 1px;
      margin-left: 20px;
    }

    .navbar-toggler {
      border: none;
    }

    .navbar-toggler:focus {
      box-shadow: none;
    }

    /* MOBILE MENU */
    @media (max-width: 991.98px) {
      .navbar-collapse {
        position: absolute;
        top: 64px;
        left: 0;
        width: 100%;
        background: #fff;
        padding: 50px 0;
      }

      .navbar-nav {
        text-align: center;
        gap: 20px;
      }

      .nav-link {
        font-size: 16px;
        letter-spacing: 2px;
        margin: 10px 0;
      }
    }

    /* HERO */
    #hero {
      height: 100vh;
      background: url("REY_347.jpg") center/cover;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.55);
    }

    .hero-content {
      position: relative;
      text-align: center;
      color: white;
    }

    .hero-small {
      font-size: 12px;
      letter-spacing: 2px;
      opacity: 0.8;
    }

    .hero-title {
      font-size: clamp(48px, 6vw, 80px);
      font-weight: 700;
      line-height: 1.1;
      margin-top: 10px;
    }

    .hero-sub {
      margin-top: 15px;
      font-size: 14px;
      opacity: 0.8;
    }

    .btn-projects {
      margin-top: 25px;
      background: white;
      color: black;
      border-radius: 50px;
      padding: 10px 30px;
      border: none;
    }

    /* PROJECT SECTION */
    #projects {
      padding: 80px 0;
      background: #f6f6f6;
    }

    /* CARD (UPDATED) */
    .project-card {
      background: #000;
      border-radius: 32px;
      padding: 14px;
      max-width: 300px;
      margin: auto;
    }

    .project-inner {
      border-radius: 24px;
      overflow: hidden;
      background: #000;
      display: flex;
      flex-direction: column;
      height: 520px;
    }

    .project-inner img {
      width: 100%;
      height: 70%;
      object-fit: cover;
      border-radius: 18px;
    }

    .project-content {
      padding: 18px 10px 6px 10px;
      display: flex;
      flex-direction: column;
      height: 30%;
    }

    .project-title {
      font-size: 42px;
      font-weight: 600;
      color: #fff;
      margin: 0;
      line-height: 1;
      letter-spacing: -1px;
    }

    .project-meta {
      font-size: 12px;
      color: rgba(255,255,255,0.6);
      display: flex;
      justify-content: space-between;
      margin-top: auto;
    }

    /* FOOTER */
    footer {
      background: #0d0d0d;
      color: rgba(255,255,255,0.6);
      padding: 30px 0;
      font-size: 12px;
    }

    .footer-links a {
      color: rgba(255,255,255,0.6);
      margin-left: 15px;
      text-decoration: none;
    }

  </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg sticky-top">
  <div class="container">
    <a class="navbar-brand" href="#">LARDI'S</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="#">HOME</a></li>
        <li class="nav-item"><a class="nav-link" href="#">ABOUT</a></li>
        <li class="nav-item"><a class="nav-link" href="#projects">PROJECT</a></li>
        <li class="nav-item"><a class="nav-link" href="#">CONTACT</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- HERO -->
<section id="hero">
  <div class="hero-content">
    <div class="hero-small">HELLO, I'M REYHAN</div>
    <div class="hero-title">Visual Storyteller</div>
    <div class="hero-sub">Photographer, Cinematographer, Editor</div>
    <button class="btn-projects">Projects</button>
  </div>
</section>

<!-- PROJECT -->
<section id="projects">
  <div class="container">
    <div class="row g-5 justify-content-center">

      <!-- CARD 1 -->
      <div class="col-md-4 d-flex justify-content-center">
        <div class="project-card">
          <div class="project-inner">
            <img src="REY_379.jpg">
            <div class="project-content">
              <h3 class="project-title">B&W</h3>
              <div class="project-meta">
                <span>First Gathering</span>
                <span>05.2026</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- CARD 2 -->
      <div class="col-md-4 d-flex justify-content-center">
        <div class="project-card">
          <div class="project-inner">
            <img src="REY_374.jpg">
            <div class="project-content">
              <h3 class="project-title">Yellow</h3>
              <div class="project-meta">
                <span>First Gathering</span>
                <span>05.2026</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- CARD 3 -->
      <div class="col-md-4 d-flex justify-content-center">
        <div class="project-card">
          <div class="project-inner">
            <img src="REY_305.jpg">
            <div class="project-content">
              <h3 class="project-title">Blue</h3>
              <div class="project-meta">
                <span>First Gathering</span>
                <span>05.2026</span>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>

<!-- FOOTER -->
<footer>
  <div class="container d-flex justify-content-between">
    <div>© 2026 Lardi's</div>
    <div class="footer-links">
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Project</a>
      <a href="#">Contact</a>
    </div>
  </div>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
