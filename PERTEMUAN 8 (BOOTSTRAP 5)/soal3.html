<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Akademik</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">

<div class="container">
  <div class="card p-4 shadow-sm">
    <div class="text-center">
      <img src="https://placehold.co/150" class="rounded-circle mb-3" alt="profile">
      <h3>Reyhan Abelard</h3>
      <span class="badge bg-success rounded-pill">Mahasiswa Aktif</span>
    </div>

    <table class="table table-hover mt-4">
      <thead>
        <tr>
          <th>Mata Kuliah</th>
          <th>Nilai</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Pemrograman Web</td>
          <td>A</td>
          <td><button class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#detailModal">Detail</button></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<div class="modal fade" id="detailModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Detail Nilai</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        Nilai akhir mata kuliah Pemrograman Web adalah A.
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
