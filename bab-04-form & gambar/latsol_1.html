        <!DOCTYPE html>
        <html>
        <head>
                <title>Form Data Pengguna</title>
        </head>
        <body>
                <h2>Form Data Pengguna</h2>
                <form>
                        Nama :
                        <input type="text" name="nama"><br><br>

                        Email :
                        <input type="email" name="email"><br><br>

                        Password :
                        <input type="password" name="password"><br><br>

                        Status :
                        <input type="radio" name="status"> Mahasiswa
                        <input type="radio" name="status"> Dosen
                        <input type="radio" name="status"> Umum
                        <br><br>

                        Minat Belajar :
                        <input type="checkbox"> Web
                        <input type="checkbox"> AI
                        <input type="checkbox"> Data Science
                        <br><br>

                        <input type="submit" value="Kirim Data">
                        <input type="reset" value="Ulangi">
                </form>
        </body>
        </html>
